# ==============================================================================
# Prometheus Scraping Configuration
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: "api-gateway"

  - job_name: "ai-agent"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-agent:8001"]
        labels:
          service: "ai-agent"

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: "otel-collector"
